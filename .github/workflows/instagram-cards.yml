
name: CatchMICE Instagram approval
on:
  schedule:
    # 07:00 KST on Tuesday and Friday = 22:00 UTC Monday and Thursday
    - cron: '0 22 * * 1,4'
  workflow_dispatch:
    inputs:
      action:
        description: 'generate or publish'
        required: true
        type: choice
        options: [generate, publish]
        default: generate
      draft_id:
        description: 'Draft ID (publish only)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: catchmice-instagram
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'schedule' || github.event.inputs.action == 'generate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'Pillow>=10,<13'
      - run: python scripts/make_cards.py
      - name: Store new drafts (public URLs required for Instagram)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/drafts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(social): prepare approval draft'
            git push
          fi
  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: instagram-publishing
    steps:
      - uses: actions/checkout@v4
      - name: Publish the explicitly approved draft
        env:
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: python scripts/publish.py
      - name: Record published state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/drafts
          git commit -m 'chore(social): record Instagram publishing' || exit 0
          git pull --rebase
          git push

