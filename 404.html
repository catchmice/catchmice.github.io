<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="CatchMICE">
<title>페이지를 찾을 수 없어요 · CatchMICE</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --paper:#F7F8FA; --card:#FFFFFF; --ink:#191F28; --muted:#4E5968; --muted2:#6B7684;
  --line:#E5E8EB; --accent:#1B56E8; --accent-ink:#FFFFFF; --soft:#EEF3FF;
  --body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F131A;--card:#171C26;--ink:#E8EDF5;--muted:#A5B0C2;--muted2:#9FAABB;--line:#252C3B;--accent:#8FA8FF;--accent-ink:#0F131A;--soft:#1E2740;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;font-size:15px;
  letter-spacing:-0.01em;word-break:keep-all;
  min-height:100vh;display:grid;place-items:center;
  padding-top:max(24px,env(safe-area-inset-top,0px));
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:440px;display:grid;gap:16px;text-align:center;justify-items:center}
.logo{display:inline-flex;align-items:baseline;font-family:var(--body);font-weight:800;font-size:21px;letter-spacing:-0.045em;color:var(--ink);text-decoration:none}
.logo b{color:var(--accent);font-weight:800}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:24px 20px;display:grid;gap:14px;justify-items:center;width:100%;
  box-shadow:0 1px 2px rgba(17,24,39,.04);
}
.face{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--soft)}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:-0.035em}
p{margin:0;color:var(--muted2);font-size:13.5px;line-height:1.6}
strong{color:var(--ink);font-weight:700}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:38px;padding:0 15px;
  border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);border:0;
}
a.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.redirect{font-size:12px;color:var(--muted2)}
.redirect a{color:var(--accent);font-weight:700;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <a class="logo" href="/#home">Catch<b>MICE</b></a>
  <div class="card">
    <img class="face" src="/img/micy.jpg" width="76" height="76" alt="Micy">
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 주소를 잘못 입력했어요.<br>Micy가 <strong>홈</strong>으로 안내할게요.</p>
    <div class="btns">
      <a class="btn" href="/#home">홈으로 가기</a>
      <a class="btn ghost" href="/#news">한입뉴스</a>
      <a class="btn ghost" href="/#jobs">채용공고</a>
    </div>
    <p class="redirect" id="redirect">5초 뒤 홈으로 이동해요 · <a href="/#home" id="stay">바로 이동</a></p>
  </div>
  <p style="font-size:12px">CatchMICE · MICE 산업·커리어 포털</p>
</main>
<script>
(function(){
  var n=5, el=document.getElementById("redirect");
  var timer=setInterval(function(){
    n--;
    if(n<=0){ clearInterval(timer); location.replace("/#home"); return; }
    if(el) el.innerHTML=n+"초 뒤 홈으로 이동해요 · <a href=\"/#home\" id=\"stay\">바로 이동</a>";
  },1000);
  setTimeout(function(){ clearInterval(timer); location.replace("/#home"); },6000);
})();
</script>
</body>
</html>
