<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatchMICE Data Lab</title><style>body{margin:0;background:#f4f7f8;color:#17334b;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}a{color:#087d76}header{padding:24px;background:#12334b;color:white;border-radius:16px}header a{color:#a6f4dc}section{background:white;border-radius:14px;padding:20px;margin:16px 0}#map{height:420px} .chart{height:320px}select{padding:10px;max-width:100%} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}li{margin:8px 0}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><main><header><a href="./">← CatchMICE</a><h1>DATA LAB / VENUE MAP</h1><p>등록 행사 데이터로 살펴보는 지역별 MICE 동향</p></header><section><h2>주요 베뉴 지도</h2><p>대표 시설의 대략적인 위치입니다. 전체 시설 목록은 아닙니다.</p><div id="map"></div><ul id="venues"></ul></section><section><h2>CatchMICE 등록 행사 분석</h2><p id="status" role="status">데이터 불러오는 중</p><label>시작 월 <select id="month"><option value="">전체</option></select></label><div class="grid"><div><h3>지역별 등록 행사</h3><div class="chart" id="regions"></div></div><div><h3>유형별 등록 행사</h3><div class="chart" id="types"></div></div></div><div id="summary"></div><p>출처: CatchMICE events.json. 전국 산업 전수 통계가 아니며 수집 범위에 따라 달라집니다.</p></section></main><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script>
const venues=[['코엑스',37.512,127.059],['킨텍스',37.668,126.745],['벡스코',35.169,129.136],['엑스코',35.907,128.612],['대전컨벤션센터',36.375,127.392],['송도컨벤시아',37.389,126.645],['김대중컨벤션센터',35.147,126.84],['제주국제컨벤션센터',33.241,126.425]];
const list=document.getElementById('venues');for(const [name,lat,lon] of venues){const li=document.createElement('li');li.textContent=name;list.append(li)}
if(window.L){const map=L.map('map').setView([36.3,127.7],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);for(const [name,lat,lon] of venues)L.marker([lat,lon]).addTo(map).bindPopup(name)}else document.getElementById('map').textContent='지도를 불러올 수 없습니다.';
const month=document.getElementById('month'),status=document.getElementById('status');let rows=[];const charts=window.echarts?['regions','types'].map(id=>echarts.init(document.getElementById(id))):[];function counts(data,key){const m=new Map();for(const row of data){const k=String(row[key]||'미분류');m.set(k,(m.get(k)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1])}function render(){const data=rows.filter(r=>!month.value||String(r.start||'').startsWith(month.value));const groups=[counts(data,'region'),counts(data,'type')];groups.forEach((g,i)=>{if(charts[i])charts[i].setOption({tooltip:{trigger:'axis'},grid:{left:65,right:20,bottom:65,top:20},xAxis:{type:'category',data:g.map(x=>x[0]),axisLabel:{interval:0,rotate:35}},yAxis:{type:'value',minInterval:1},series:[{type:'bar',data:g.map(x=>x[1]),itemStyle:{color:'#16877b'}}]})});document.getElementById('summary').textContent='등록 행사 '+data.length+'건 | '+groups.map(g=>g.map(x=>x[0]+' '+x[1]+'건').join(' · ')).join(' / ')}month.addEventListener('change',render);window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));fetch('./events.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(!Array.isArray(d.items))throw Error();rows=d.items;for(const m of [...new Set(rows.map(r=>String(r.start||'').slice(0,7)).filter(s=>/^\d{4}-\d{2}$/.test(s)))].sort()){const o=document.createElement('option');o.value=o.textContent=m;month.append(o)}status.textContent='데이터 기준: '+(d.updated||'미상');render()}).catch(()=>status.textContent='행사 데이터를 불러오지 못했습니다.');</script></html>
