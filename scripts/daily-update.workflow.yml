name: Daily data update

# ⚠️ 이 파일은 옮겨 두기용 사본입니다.
#    GitHub에서 `.github/workflows/daily-update.yml` 경로로 새 파일을 만들어
#    이 내용을 그대로 붙여 넣으면 매일 자동 실행이 켜집니다.
#    (Pickle GitHub App에 workflows 권한이 없어 PR에서 그 경로로 직접 올릴 수 없었습니다.)
#
# jobs.json(채용공고)과 news.json(한입뉴스)을 매일 아침 자동으로 갱신합니다.
# cron은 UTC 기준입니다. 22:00 UTC = 다음 날 07:00 KST.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: # Actions 탭 > Daily data update > Run workflow 로 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 수집 및 갱신
        run: python scripts/update_data.py

      - name: 바뀐 내용이 있으면 커밋 후 푸시
        env:
          GIT_AUTHOR_NAME: catchmice
          GIT_AUTHOR_EMAIL: catchmice@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if git diff --quiet -- jobs.json news.json; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git add jobs.json news.json
          git commit -m "chore(data): $(TZ=Asia/Seoul date +%Y-%m-%d) MICE 데이터 자동 업데이트"
          git push
